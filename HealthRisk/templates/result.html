
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f7f5;
            text-align: center;
            padding: 50px 15px;
        }
        .card {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 35px;
            border-radius: 16px;
        }
        h1 { color: #079669; }
        .result { font-size: 24px; font-weight: bold; }
        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background: #079669;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>HealthRisk AI</h1>
        <h2>Prediction Result</h2>
        <p class="result">{{ result }}</p>
        <p>Model-estimated positive class probability: {{ probability }}%</p>
        <p>This estimate is not a diagnosis or a clinically validated risk score.</p>
        <a href="/">Check Again</a>
    </div>
</body>
</html>
